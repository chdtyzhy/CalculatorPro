<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术支持 - 芃芃计算器</title>
    <style>
        :root {
            --bg: #1c1c1e;
            --card: #2c2c2e;
            --text: #f5f5f7;
            --muted: #a1a1a6;
            --accent: #ffa00f;
            --border: #3a3a3c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px 96px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 600;
        }
        .sub, p { color: var(--muted); }
        h2 {
            margin: 40px 0 12px;
            font-size: 20px;
            font-weight: 600;
        }
        .card {
            margin: 16px 0;
            padding: 20px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
        }
        .card h3 { margin: 0 0 8px; font-size: 16px; }
        .card p { margin: 0; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <h1>芃芃计算器技术支持</h1>
            <div class="sub">简单、快速的离线计算器</div>
        </header>

        <h2>常见问题</h2>
        <section class="card">
            <h3>计算记录会上传吗？</h3>
            <p>不会。芃芃计算器完全离线运行，不会收集或上传您的计算数据。</p>
        </section>
        <section class="card">
            <h3>如何清除当前计算？</h3>
            <p>轻点 AC 按钮即可清除当前输入和计算状态。</p>
        </section>
        <section class="card">
            <h3>应用运行异常怎么办？</h3>
            <p>请先退出并重新打开应用，同时确认设备已安装可用的最新 iOS 版本。</p>
        </section>

        <h2>联系我们</h2>
        <p>如果问题仍未解决，请在 <a href="https://github.com/chdtyzhy/CalculatorPro/issues/new">CalculatorPro 问题反馈页</a>联系我们，并说明设备型号、iOS 版本和问题现象。</p>

        <h2>隐私政策</h2>
        <p><a href="privacy-policy.html">查看芃芃计算器隐私政策</a></p>
    </main>
</body>
</html>
